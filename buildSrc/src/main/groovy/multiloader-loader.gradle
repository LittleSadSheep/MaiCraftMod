plugins {
    id 'multiloader-common'
}

// 加载器模块可解析公共模块导出的源码和资源目录。
configurations {
    commonJava{
        canBeResolved = true
    }
    commonResources{
        canBeResolved = true
    }
}

// 编译依赖公共模块的接口，同时取得它的源码目录；最终是按各加载器环境重新编译共享源码。
dependencies {
    compileOnly(project(':common')) {
        capabilities {
            requireCapability "$group:$mod_id"
        }
    }
    commonJava project(path: ':common', configuration: 'commonJava')
    commonResources project(path: ':common', configuration: 'commonResources')
}

// Register common resources as actual source-set inputs so loader tooling such as
// Fabric Loom can discover and post-process common mixin configuration files.
// 把共享资源登记为真正的资源输入，让 Fabric 等工具也能找到并处理公共 Mixin 配置。
sourceSets {
    main {
        resources.srcDir(project(':common').file('src/main/resources'))
    }
}

// 编译、Javadoc 和源码包都使用同一份公共源码，不手动复制一套文件到加载器目录。
tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

processResources {
    dependsOn(configurations.commonResources)
}

tasks.named('javadoc', Javadoc).configure {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

tasks.named('sourcesJar', Jar) {
    dependsOn(configurations.commonJava)
    from(configurations.commonJava)
    dependsOn(configurations.commonResources)
}
