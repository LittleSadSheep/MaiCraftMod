name: 功能建议
description: 提出新能力或改进现有行为
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议。提交前请先检索现有 issue，避免重复提报。
  - type: textarea
    id: scenario
    attributes:
      label: 问题场景
      description: 你想达成什么目标，或遇到了什么限制？说清场景比列出想要的功能更能帮助判断方向。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 你期望的使用方式或行为。
    validations:
      required: true
  - type: input
    id: ability
    attributes:
      label: 涉及能力（可选）
      description: 若与现有能力相关，填写能力名（如 mine、travel、craft、acquire）。
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你考虑或尝试过的其他做法。
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: 补充
      description: 截图、录像或其他背景信息。
    validations:
      required: false
