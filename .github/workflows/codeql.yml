name: CodeQL

# 与构建检查一致，仅在开发成果合入并推送 main 后扫描集成代码。
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: actions
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle and validate wrapper
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # 扫描器与 Gradle 会同时占用内存，为三个模块的实际编译保留空间。
          ram: 3072
          threads: 2

      - name: Compile all mod entry points
        if: matrix.language == 'java-kotlin'
        # 显式编译公共逻辑和两个加载器入口，让扫描使用真实 Minecraft 类路径；回归由 CI 负责。
        # 禁用编译结果缓存，确保 CodeQL 能观察本次 javac 执行，而不是复用未追踪的类文件。
        run: >-
          bash ./gradlew :common:classes :fabric:classes :neoforge:classes
          --no-daemon --no-parallel --max-workers=1 --no-build-cache --console=plain --stacktrace

      - name: Analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}
