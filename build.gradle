// 在根项目声明两种加载器插件的版本，具体模块再启用；这里的 apply false 不会直接把插件应用到根项目。
plugins {
    // see https://fabricmc.net/develop/ for new versions
    id 'fabric-loom' version '1.8-SNAPSHOT' apply false
    // see https://projects.neoforged.net/neoforged/moddevgradle for new versions
    id 'net.neoforged.moddev' version '2.0.141' apply false
}

// 所有子项目产物统一过滤只供编译的第三方接口和未启用的 Baritone 钩子，避免打进游戏后出现两套控制逻辑。
subprojects {
    tasks.withType(Jar).configureEach {
        // 这些是编译时借用的接口外形，不能当成对应 Mod 的真实实现一起发布。
        exclude 'fi/dy/**'
        exclude 'com/github/lunatrius/**'

        // MaiCraft 自己驱动 Baritone，因此排除它独立启动时使用的接线和未启用的 Mixin。
        // 配置里实际保留的五个 Mixin 不在下列排除项中。
        exclude 'baritone/launch/BaritoneMixinConnector*'
        exclude 'baritone/launch/mixins/MixinClientPlayNetHandler*'
        exclude 'baritone/launch/mixins/MixinClientPlayerEntity*'
        exclude 'baritone/launch/mixins/MixinCommandSuggestionHelper*'
        exclude 'baritone/launch/mixins/MixinEntityRenderManager*'
        exclude 'baritone/launch/mixins/MixinFireworkRocketEntity*'
        exclude 'baritone/launch/mixins/MixinItemStack*'
        exclude 'baritone/launch/mixins/MixinLootContextBuilder*'
        exclude 'baritone/launch/mixins/MixinLootTable*'
        exclude 'baritone/launch/mixins/MixinMinecraft*'
        exclude 'baritone/launch/mixins/MixinNetworkManager*'
        exclude 'baritone/launch/mixins/MixinPalettedContainer*'
        exclude 'baritone/launch/mixins/MixinScreen*'
        exclude 'baritone/launch/mixins/MixinWorldRenderer*'
    }
}
