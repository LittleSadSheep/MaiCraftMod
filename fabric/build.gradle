plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

// Fabric 模块直接编译公共源码，因此要提供 Minecraft、官方映射加 Parchment 参数名、Fabric Loader 与 API。
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // 内嵌 Baritone 的源码引用 javax.annotation 注解与 ASM；加载器重编译 common 源码时也要在类路径上。
    compileOnly group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.2'
    compileOnly group: 'org.ow2.asm', name: 'asm', version: '9.7.1'
    compileOnly group: 'org.ow2.asm', name: 'asm-tree', version: '9.7.1'

    // SQLite 驱动打进 Mod 的 Jar 里（include = 嵌入依赖）。
    include(implementation("org.xerial:sqlite-jdbc:${sqlite_jdbc_version}"))
}

// 配置可选访问扩展、Mixin 映射文件，以及开发时的客户端与服务器启动方式。
loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
            vmArg '-Xmx3072M'
            programArgs '--width', '1280', '--height', '720'
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}
