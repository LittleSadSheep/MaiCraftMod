// 告诉 Gradle 去哪些仓库找构建插件；Fabric 与 Sponge 的坐标只向各自仓库解析，减少错误来源匹配。
pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = uri('https://maven.fabricmc.net')
                }
            }
            filter {
                includeGroupAndSubgroups('net.fabricmc')
                includeGroup('fabric-loom')
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Sponge'
                    url = uri('https://repo.spongepowered.org/repository/maven-public')
                }
            }
            filter {
                includeGroupAndSubgroups('org.spongepowered')
            }
        }
    }
}

// 让构建能按项目要求自动寻找合适的 JDK。
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// 根项目由公共代码、Fabric 版本和 NeoForge 版本三个模块组成。
rootProject.name = 'MaiCraft'
include('common')
include('fabric')
include('neoforge')
