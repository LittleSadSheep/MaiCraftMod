# NeoForge 读取的 Mod 元信息；占位符由 Gradle 构建时替换。
modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license = "${license}"

# Mod 的标识与显示信息，不负责注册游戏行为。
[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
credits = "${credits}"
authors = "${mod_author}"
description = '''${description}'''

# 公共 Mixin 配置；具体 Mixin 随平台层移植加入。
[[mixins]]
config = "${mod_id}.mixins.json"

# 服务端 Mixin：方块归属记录的放置钩子。
[[mixins]]
config = "${mod_id}-server.mixins.json"

# 内嵌 Baritone 的客户端钩子；只保留实际生效的五个 Mixin。
[[mixins]]
config = "maicraft-baritone.mixins.json"

# 通用入口在两端加载；客户端部分由单独的 dist=CLIENT 入口限定。
[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
