import java.util.zip.ZipFile

plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

// 选择 NeoForge 版本与映射，并配置开发运行入口；可选访问转换文件来自公共模块。
neoForge {
    version = neoforge_version
    // 文件存在时自动启用 NeoForge AccessTransformers。
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
            jvmArgument('-Xmx3072M')
            programArguments.addAll '--width', '1280', '--height', '720'
            // 自动验收只进入事先复制好的世界；拒绝模板名与目录穿越，防止快速启动写入原模板。
            def testWorld = providers.gradleProperty('maicraftTestWorld')
            if (testWorld.isPresent()) {
                def worldName = testWorld.get()
                if (worldName.equalsIgnoreCase('TEST-Template') || worldName in ['.', '..'] || worldName.contains('/') || worldName.contains('\\')) {
                    throw new GradleException('maicraftTestWorld must name a copied test world, never TEST-Template')
                }
                if (!file("run/saves/${worldName}").isDirectory()) {
                    throw new GradleException("Copied test world does not exist: ${worldName}")
                }
                programArguments.addAll '--quickPlaySingleplayer', worldName
                // 用户要求副本内无人提示验收，这次进程不等待人工审图；不改日常客户端保存的 Dev 配置。
                systemProperty 'maicraft.preview.enabled', 'false'
                // 设计和观察也属于本轮自动测试，进世界就交出身体，让本能自卫不必等到首个施工指令。
                systemProperty 'maicraft.automation.on_join', 'true'
            }
        }
        // 这是数据生成的启动配置；还需要实际的数据提供器注册，声明 runData 不会自动调用任意 Java 数据清单。
        data {
            data()

            // 可在终端运行 "./gradlew :neoforge:runData" 执行数据生成。
            // 指定用于数据生成的 modid、生成资源的输出位置，以及查找现有资源的目录。
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()

        }
        server {
            server()
        }
    }
    // 告诉开发运行环境，当前 Mod 的代码来自本模块主源码集。
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// 若运行数据生成得到资源，这个目录会参与打包；当前是否真的生成了标签要检查提供器和输出文件。
sourceSets.main.resources { srcDir 'src/generated/resources' }

// 开发客户端必须使用本次编译的 Mod；mods 里同名打包产物会遮蔽开发类，不能让测试误跑旧执行器。
def checkDevelopmentMods = tasks.register('checkDevelopmentMods') {
    group = 'verification'
    description = '拒绝开发客户端 mods 目录中的重复 MaiCraft 打包产物'
    doLast {
        def duplicates = fileTree('run/mods').matching { include '*.jar' }.files.findAll { jar ->
            new ZipFile(jar).withCloseable { zip ->
                ['META-INF/neoforge.mods.toml', 'META-INF/mods.toml'].any { descriptor ->
                    def entry = zip.getEntry(descriptor)
                    def marker = /(?m)^\s*modId\s*=\s*["']@MOD_ID@["']/
                    entry != null && zip.getInputStream(entry).withCloseable { input ->
                        (input.getText('UTF-8') =~ marker.replace('@MOD_ID@', mod_id)).find()
                    }
                }
            }
        }
        if (!duplicates.isEmpty()) {
            throw new GradleException('Packaged ' + mod_id + ' jars shadow development classes. Move them out of run/mods: ' + duplicates*.name.join(', '))
        }
    }
}
tasks.named('runClient') { dependsOn checkDevelopmentMods }
