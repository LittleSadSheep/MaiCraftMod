plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

// NeoForge 模块：编译版本、可选访问转换、Parchment 参数名，以及开发时的客户端、服务器与数据生成启动项。
neoForge {
    version = neoforge_version
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            // 与 Fabric 的启动项命名保持一致，IDE 里一眼能分清是哪个加载器。
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})"
        }
        client {
            client()
            jvmArgument('-Xmx3072M')
            programArguments.addAll '--width', '1280', '--height', '720'
            // 实机测试：设了 MAICRAFT_JOIN_SERVER（如 localhost:25565）就开机直连那台服务端，用 MAICRAFT_USERNAME 当玩家名。
            def joinServer = System.getenv('MAICRAFT_JOIN_SERVER')
            if (joinServer) {
                programArguments.addAll '--quickPlayMultiplayer', joinServer
            }
            def username = System.getenv('MAICRAFT_USERNAME')
            if (username) {
                programArguments.addAll '--username', username
            }
        }
        data {
            data()
            // 数据生成：./gradlew :neoforge:runData，输出到 src/generated/resources。
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        server {
            server()
            // 专用服务端单独一个目录：和客户端共用 run 会抢同一份 logs/latest.log 与配置。
            gameDirectory = file('run-server')
            programArguments.add '--nogui'
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// 联动模组的 jar 从 Modrinth 的 maven 取，只放行 maven.modrinth 这个组；官方 maven 要登录令牌，CI 拿不到。
repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
    // Ponder（Create 的思索）与机械动力本体从 Create 团队的官方 maven 取，免登录；只放行这两个组。
    exclusiveContent {
        forRepository {
            maven {
                name = 'Create'
                url = 'https://maven.createmod.net'
            }
        }
        filter {
            includeGroup 'net.createmod.ponder'
            includeGroup 'com.simibubi.create'
        }
    }
    // EMI 从它的官方 maven 取（TerraformersMC，会转到 repo.sleeping.town），免登录。
    exclusiveContent {
        forRepository {
            maven {
                name = 'TerraformersMC'
                url = 'https://maven.terraformersmc.com/releases'
            }
        }
        filter { includeGroup 'dev.emi' }
    }
    // JEI 从它的官方 maven 取（BlameJared），免登录。
    exclusiveContent {
        forRepository {
            maven {
                name = 'BlameJared'
                url = 'https://maven.blamejared.com'
            }
        }
        filter { includeGroup 'mezz.jei' }
    }
    // 通用机械（Mekanism）从它的官方 maven 取，免登录；只放行 mekanism 这个组。
    exclusiveContent {
        forRepository {
            maven {
                name = 'ModMaven'
                url = 'https://modmaven.dev'
            }
        }
        filter { includeGroup 'mekanism' }
    }
    // 喷气背包用的 FlightLib 从作者（Possible_triangle）的官方 maven 取，免登录；只放行 com.possible-triangle 这个组。
    // 喷气背包本体 5.1.2 不在官方 maven 上（只有 5.1.1、5.1.3），从 Modrinth 取。
    exclusiveContent {
        forRepository {
            maven {
                name = 'PossibleTriangle'
                url = 'https://registry.somethingcatchy.net/repository/maven-public/'
            }
        }
        filter { includeGroup 'com.possible-triangle' }
    }
    // Sable（物理结构）与它带的 sable-companion 从作者（ryanhcode）的官方 maven 取，免登录。
    exclusiveContent {
        forRepository {
            maven {
                name = 'RyanHCode'
                url = 'https://maven.ryanhcode.dev/releases'
            }
        }
        filter {
            includeGroup 'dev.ryanhcode.sable'
            includeGroup 'dev.ryanhcode.sable-companion'
            includeGroup 'dev.simulated_team.simulated'
        }
    }
    // FTB 任务、FTB 连锁破坏与 FTB Library 从 FTB 的官方 maven 取，免登录。
    exclusiveContent {
        forRepository {
            maven {
                name = 'FTB'
                url = 'https://maven.ftb.dev/releases'
            }
        }
        filter { includeGroup 'dev.ftb.mods' }
    }
    // Architectury 从它的官方 maven 取：FTB 的包都经它的网络层收发，发 FTB 的包要走它。
    exclusiveContent {
        forRepository {
            maven {
                name = 'Architectury'
                url = 'https://maven.architectury.dev/'
            }
        }
        filter { includeGroup 'dev.architectury' }
    }
}

// SQLite 驱动与 HTML 解析器用 JarJar 打进 Mod 的 Jar 里，并加进开发运行的类路径。
dependencies {
    // 内嵌 Baritone 的源码引用 javax.annotation 注解与 ASM；加载器重编译 common 源码时也要在类路径上。
    compileOnly group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.2'
    compileOnly group: 'org.ow2.asm', name: 'asm', version: '9.7.1'
    compileOnly group: 'org.ow2.asm', name: 'asm-tree', version: '9.7.1'
    // 联动模组只在编译时可见：读写端直接调用它们的类；游戏里没装时读写端类不会被加载，所以不进包、不进运行类路径。
    compileOnly "maven.modrinth:sophisticated-backpacks:${sophisticatedbackpacks_version}"
    compileOnly "maven.modrinth:sophisticated-core:${sophisticatedcore_version}"
    // AE2 只要它自己的类，不带它的运行依赖（GuideME 等）：读写端用不到，开发客户端里自己放 jar。
    compileOnly("org.appliedenergistics:appliedenergistics2:${ae2_version}") { transitive = false }
    // Ponder 只要它自己的类：读写端只读场景注册表、在演示世界里放场景，不碰 Flywheel 的渲染。
    compileOnly("net.createmod.ponder:ponder-neoforge:${ponder_version}") { transitive = false }
    // 机械动力只要它自己的类：读写端读动力、传送带、链条输送机、置物台这些方块实体，不碰 Flywheel 的渲染。
    compileOnly("com.simibubi.create:create-${minecraft_version}:${create_version}") { transitive = false }
    // 通用机械只要它自己的类：读写端读侧面配置、管道连接、配置器模式，发配置器换模式的包。
    compileOnly("mekanism:Mekanism:${mekanism_version}") { transitive = false }
    // EMI 要整个 jar：加载完没有要看 runtime 包里的 EmiReloadManager。JEI 只要两份公开接口。
    compileOnly("dev.emi:emi-neoforge:${emi_version}") { transitive = false }
    compileOnly("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}") { transitive = false }
    compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}") { transitive = false }
    // FTB 任务的类里用到 FTB Library 的类型（三态开关等），编译时两者都要在。
    compileOnly("dev.ftb.mods:ftb-quests-neoforge:${ftbquests_version}") { transitive = false }
    compileOnly("dev.ftb.mods:ftb-library-neoforge:${ftblibrary_version}") { transitive = false }
    // FTB 连锁破坏只要它自己的类：读写端按连锁键、发切形状包、读选区；配置值的类型在上面那份 FTB Library 里。
    compileOnly("dev.ftb.mods:ftb-ultimine-neoforge:${ftbultimine_version}") { transitive = false }
    // FTB 的包由 Architectury 登记、包一层再发：切形状包要经它的 NetworkManager 发，直接用 NeoForge 发会编码失败断线。
    compileOnly("dev.architectury:architectury-neoforge:${architectury_version}") { transitive = false }
    // 喷气背包读服务器同步下来的耗气设置；开关状态与按键检查是它带的 FlightLib 的类（实例里打在喷气背包的 jar 里）。
    compileOnly("maven.modrinth:create-jetpack:${createjetpack_version}") { transitive = false }
    compileOnly("com.possible-triangle:flightlib-neoforge:${flightlib_version}") { transitive = false }
    // Sable 读子世界的位姿、地块与角色被哪个子世界带着；位姿与包围盒是 sable-companion 的类（实例里打在 Sable 的 jar 里）。
    compileOnly("dev.ryanhcode.sable:sable-neoforge-${minecraft_version}:${sable_version}") { transitive = false }
    compileOnly("dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:${sable_companion_version}") { transitive = false }
    // Simulated（Create Aeronautics 一套里的载具部件）：拉物理组装器的杆发它自己的组装包。
    compileOnly("dev.simulated_team.simulated:simulated-neoforge-${minecraft_version}:${simulated_version}") { transitive = false }
    jarJar(implementation('org.xerial:sqlite-jdbc')) {
        version { strictly "[${sqlite_jdbc_version},4.0)"; prefer sqlite_jdbc_version }
    }
    additionalRuntimeClasspath "org.xerial:sqlite-jdbc:${sqlite_jdbc_version}"
    jarJar(implementation('org.jsoup:jsoup')) {
        version { strictly "[${jsoup_version},2.0)"; prefer jsoup_version }
    }
    additionalRuntimeClasspath "org.jsoup:jsoup:${jsoup_version}"
}
