plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

// 公共模块借助 NeoForm 编译 Minecraft API；有访问转换配置时才额外启用。
neoForge {
    neoFormVersion = neo_form_version
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

// Mixin 与 MixinExtras 由两个加载器在运行时提供，公共源码只需编译期依赖。
// 测试使用 JUnit 5；ArchUnit 把 docs/design/02 第 7 节的分层与编码规则变成构建会失败的检查。
dependencies {
    // 世界进度存在 SQLite 里；驱动随 Mod 打包内置。
    implementation "org.xerial:sqlite-jdbc:${sqlite_jdbc_version}"

    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
    // 内嵌 Baritone 源码保留上游可空性注解，公共编译需要对应的注解类型。
    compileOnly group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.2'
    // 内嵌 Baritone 的 Mixin 源码直接使用 ASM 的指令常量。
    compileOnly group: 'org.ow2.asm', name: 'asm', version: '9.7.1'
    compileOnly group: 'org.ow2.asm', name: 'asm-tree', version: '9.7.1'
    compileOnly group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.5.3'
    annotationProcessor group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.5.3'

    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation "com.tngtech.archunit:archunit-junit5:${archunit_version}"
}

// 决策类与内核的测试会用到 Minecraft 的值类型，测试类路径沿用主源码的编译类路径；测试本身不启动游戏。
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.compileClasspath

// 把公共 Java 源码与资源目录作为可供两个加载器模块取用的产物。公共模块不反过来解析这两份配置。
configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}
