plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

// 公共模块借助 NeoForm 编译 Minecraft API，使用指定映射；有访问转换配置时才额外启用。
neoForge {
    neoFormVersion = neo_form_version
    // Automatically enable AccessTransformers if the file exists
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

// Mixin 等依赖供编译和注解处理使用，游戏运行时由加载器提供；测试可另有专门的运行依赖。
dependencies {
    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
    compileOnly group: 'org.ow2.asm', name: 'asm', version: '9.7.1'
    compileOnly group: 'org.ow2.asm', name: 'asm-tree', version: '9.7.1'
    // Vendored Baritone sources retain their upstream nullability annotations.
    compileOnly group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.2'
    // fabric and neoforge both bundle mixinextras, so it is safe to use it in common
    compileOnly group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.5.3'
    annotationProcessor group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.5.3'
    // MeshData index-order regressions exercise native buffers without opening an OpenGL window.
    def nativeOs = System.getProperty('os.name').toLowerCase(java.util.Locale.ROOT)
    def nativeArch = System.getProperty('os.arch').toLowerCase(java.util.Locale.ROOT)
    def nativePlatform = nativeOs.contains('win') ? 'windows' : nativeOs.contains('mac') ? 'macos' : 'linux'
    def nativeSuffix = nativeArch in ['aarch64', 'arm64'] ? '-arm64' :
            nativeArch in ['x86', 'i386', 'i686'] ? '-x86' : nativeArch.startsWith('arm') ? '-arm32' : ''
    testRuntimeOnly "org.lwjgl:lwjgl:3.3.3:natives-${nativePlatform}${nativeSuffix}"
}

// 把公共 Java 源码与资源目录作为可供两个加载器模块取用的产物。公共模块不反过来解析这两份配置。
configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

// Run the machine boundary regressions without introducing a test-framework dependency.
// NeoForm exposes Minecraft on main's compile classpath only; standalone tests need the same types.
// 独立 main 测试也需要 Minecraft 类型，把公共编译类路径补给测试；它们不依赖 JUnit 自动发现。
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.compileClasspath
// 机器与建造测试由这个入口顺序运行，并纳入 check。工作目录放在 build 下，避免测试日志散落项目根目录。
tasks.register('machineRegression', JavaExec) {
    group = 'verification'
    description = 'Checks machine evidence, design contracts and native request boundaries.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    classpath(tasks.named('createMinecraftArtifacts').flatMap { it.resourcesArtifact })
    mainClass = 'org.maiwithu.maicraft.intent.MachineRegressionSuite'
    maxHeapSize = '512m'
    def regressionDirectory = layout.buildDirectory.dir('machine-regression')
    workingDir regressionDirectory.get().asFile
    doFirst { regressionDirectory.get().asFile.mkdirs() }
}
tasks.named('check') { dependsOn tasks.named('machineRegression') }

// 导航回归入口，限制整组运行时间，检查路径、取消、移动、落地和交通相关行为。
tasks.register('navigationRegression', JavaExec) {
    group = 'verification'
    description = 'Checks path cancellation, bounded tick execution, door passage and physical progress.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    classpath(tasks.named('createMinecraftArtifacts').flatMap { it.resourcesArtifact })
    mainClass = 'org.maiwithu.maicraft.core.pathing.NavigationRegressionSuite'
    maxHeapSize = '512m'
    timeout = java.time.Duration.ofSeconds(45)
    def regressionDirectory = layout.buildDirectory.dir('navigation-regression')
    workingDir regressionDirectory.get().asFile
    doFirst { regressionDirectory.get().asFile.mkdirs() }
}

tasks.named('check') { dependsOn tasks.named('navigationRegression') }

