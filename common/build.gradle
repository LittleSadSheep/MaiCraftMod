        entry: 'org.maiwithu.maicraft.core.integration.physics.flight.AircraftFlightRegressionSuite',
        heap: '512m', directory: 'flight-control-regression', timeoutSeconds: 60,
        purpose: '验证飞控按真实接地证据切换起降阶段和姿态反馈'
