import java.time.Duration

plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

// 公共模块借助 NeoForm 编译 Minecraft API，使用指定映射；有访问转换配置时才额外启用。
neoForge {
    neoFormVersion = neo_form_version
    // 存在访问转换配置时才启用，让测试与游戏编译遵守同一可见性要求。
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

// Mixin 等依赖供编译和注解处理使用，游戏运行时由加载器提供；测试可另有专门的运行依赖。
dependencies {
    // 公共存储回归使用与游戏相同的 SQLite 原生驱动，确认实际落盘与事务回滚。
    implementation "org.xerial:sqlite-jdbc:${sqlite_jdbc_version}"
    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
    compileOnly group: 'org.ow2.asm', name: 'asm', version: '9.7.1'
    compileOnly group: 'org.ow2.asm', name: 'asm-tree', version: '9.7.1'
    // 内置 Baritone 保留上游可空性注解，公共编译仍需要对应注解类型。
    compileOnly group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.2'
    // 两个加载器都提供 MixinExtras，公共源码可使用同一套注入扩展。
    compileOnly group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.5.3'
    annotationProcessor group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.5.3'
    // 预览网格排序测试使用原生缓冲区，因此按当前系统选择 LWJGL 运行库，无须打开游戏窗口。
    def nativeOs = System.getProperty('os.name').toLowerCase(Locale.ROOT)
    def nativeArch = System.getProperty('os.arch').toLowerCase(Locale.ROOT)
    def nativePlatform = nativeOs.contains('win') ? 'windows' : nativeOs.contains('mac') ? 'macos' : 'linux'
    def nativeSuffix = nativeArch in ['aarch64', 'arm64'] ? '-arm64' :
            nativeArch in ['x86', 'i386', 'i686'] ? '-x86' : nativeArch.startsWith('arm') ? '-arm32' : ''
    testRuntimeOnly "org.lwjgl:lwjgl:3.3.3:natives-${nativePlatform}${nativeSuffix}"
    // 预览网格分配与释放缓冲区时还会调用 jemalloc；显式提供匹配的原生库，避免借用宿主旧 DLL 或游戏遗留缓存。
    testRuntimeOnly "org.lwjgl:lwjgl-jemalloc:3.3.3:natives-${nativePlatform}${nativeSuffix}"
}

// 把公共 Java 源码与资源目录作为可供两个加载器模块取用的产物。公共模块不反过来解析这两份配置。
configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

// 独立 main 测试也需要 Minecraft 类型；普通 Gradle test 不会自动发现这些回归入口。
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.compileClasspath

// 各组只声明场景入口和资源预算，类路径、工作目录创建与 check 接线在下方统一处理。
// 大型建筑保持独立的两 GiB 进程；其余测试沿用各自原有堆大小和超时，不挤进同一个游戏进程。
def regressionSuites = [
    // 随行补光独立验证副手、镜头与主任务并行，避免用真实角色承担重复消耗风险。
    lightingRegression: [
        entry: 'org.maiwithu.maicraft.client.actor.AuxiliaryActionTest',
        heap: '512m', directory: 'lighting-regression', timeoutSeconds: 60,
        purpose: '验证随行副手补光与主任务资源协作'
    ],
    // 主动寻死只走原生危险动作；独立回放保护豁免、危险变化和死亡证据，避免真实角色承担测试风险。
    suicideRegression: [
        entry: 'org.maiwithu.maicraft.core.task.suicide.SuicideRegressionSuite',
        heap: '512m', directory: 'suicide-regression', timeoutSeconds: 60,
        purpose: '验证主动寻死的参数、已加载危险与原生死亡结算'
    ],
    // 配平比较关桨、运行和扰动恢复；独立进程避免真实游戏状态影响数学与协议回归。
    physicsBalanceRegression: [
        entry: 'org.maiwithu.maicraft.core.integration.physics.balance.PhysicsBalanceRegression',
        heap: '512m', directory: 'physics-balance-regression', timeoutSeconds: 90,
        purpose: '验证起飞前配平、蒙皮容积、启停扰动与原生补丁契约',
    ],
    // 跑图候选按扇区核实，群系与结构目录分页读取，避免用反方向近目标或固定原版名单替代请求。
    explorationRegression: [
        entry: 'org.maiwithu.maicraft.core.task.explore.ExplorationRegressionSuite',
        heap: '768m', directory: 'exploration-regression', timeoutSeconds: 90,
        purpose: '验证方向探索、群系目录与结构搜索契约'
    ],
    // 独立验证数据库事务，避免任务进程内缓存掩盖实际的持久化失败。
    memoryRegression: [
        entry: 'org.maiwithu.maicraft.intent.persistence.MemoryRegressionSuite',
        heap: '512m', directory: 'memory-regression', timeoutSeconds: 60,
        purpose: '验证 SQLite 记忆隔离、迁移与事务回滚'
    ],
    // 翻箱记忆与供料顺序独立核对，避免一次菜单变化被误记成箱内没有物品。
    containerSearchRegression: [
        entry: 'org.maiwithu.maicraft.core.task.container.ContainerSearchRegressionSuite',
        heap: '512m', directory: 'container-search-regression', timeoutSeconds: 60,
        purpose: '验证视线内翻箱、三类记忆顺序与固定起点范围'
    ],
    // 任务遇到短暂库存或菜单同步时内部续作，真正失败则一次交付可用现场与全部已确认效果。
    failureReceiptRegression: [
        entry: 'org.maiwithu.maicraft.intent.FailureReceiptRegressionSuite',
        heap: '768m', directory: 'failure-receipt-regression', timeoutSeconds: 90,
        purpose: '验证无须模型重发的恢复与完整失败回执'
    ],
    // 终端动态电量测试注册同名惰性物品与组件，独占进程，不能让模拟注册影响其他组的模组可用性判断。
    nativeInventoryIdentityRegression: [
        entry: 'org.maiwithu.maicraft.client.actor.NativeInventoryIdentityTest',
        heap: '512m', directory: 'native-inventory-identity-regression', timeoutSeconds: 45,
        purpose: '验证无线终端电量同步期间的原生背包交换'
    ],
    // 原生多物品放置映射需要临时注册模拟模组；独占进程避免改变其他组对未安装模组的判断。
    nativeProjectMaterialsRegression: [
        entry: 'org.maiwithu.maicraft.core.task.build.NativeBuildProjectMaterialsTest',
        heap: '512m', directory: 'native-project-materials-regression', timeoutSeconds: 45,
        purpose: '验证原生变体物品的施工项目恢复'
    ],
    machineRegression: [
        entry: 'org.maiwithu.maicraft.intent.MachineRegressionSuite',
        heap: '512m', directory: 'machine-regression',
        purpose: '验证机器证据、设计契约与请求边界'
    ],
    // 场地有效性与失败补读单独回放，保证时间、编号消费和回执折叠都覆盖到真实世界观察。
    snapshotRegression: [
        entry: 'org.maiwithu.maicraft.intent.MachineSnapshotRegressionSuite',
        heap: '512m', directory: 'snapshot-regression', timeoutSeconds: 45,
        purpose: '验证场地变化与失败回执中的最新快照'
    ],
    buildingBudgetRegression: [
        entry: 'org.maiwithu.maicraft.intent.BuildingBudgetRegressionSuite',
        heap: '768m', directory: 'building-budget-regression', timeoutSeconds: 120,
        purpose: '验证建筑预算、导入、预览与持久化'
    ],
    largeBuildingRegression: [
        entry: 'org.maiwithu.maicraft.intent.LargeBuildingBudgetTest',
        heap: '2g', directory: 'large-building-regression', timeoutSeconds: 180,
        purpose: '验证大型建筑编译、导出与进度恢复'
    ],
    enchantRegression: [
        entry: 'org.maiwithu.maicraft.intent.EnchantRegressionSuite',
        heap: '768m', directory: 'enchant-regression', timeoutSeconds: 120,
        purpose: '验证附魔报价、消费日志与单次提交'
    ],
    nativeProcessRegression: [
        entry: 'org.maiwithu.maicraft.intent.NativeProcessRegressionSuite',
        heap: '1g', directory: 'native-process-regression', timeoutSeconds: 180,
        purpose: '验证原生机器工序、有限配方与物品归因'
    ],
    navigationRegression: [
        entry: 'org.maiwithu.maicraft.core.pathing.NavigationRegressionSuite',
        heap: '512m', directory: 'navigation-regression', timeoutSeconds: 45,
        purpose: '验证导航取消、路径推进、开门与落地'
    ],
    // 多次启动独立 JVM，覆盖首条平地路线与物品准备的先后关系，防止预热后的单进程测试漏掉会话故障。
    navigationStartupRegression: [
        entry: 'org.maiwithu.maicraft.core.pathing.baritone.NavigationStartupRegressionSuite',
        heap: '512m', directory: 'navigation-startup-regression', timeoutSeconds: 200,
        purpose: '验证冷启动寻路和按需垫块准备'
    ],
    // 聊天独立回放界面收尾与持久发送，不让其他游戏操作回归遮住消息提交结论。
    chatRegression: [
        entry: 'org.maiwithu.maicraft.client.actor.ChatRegressionSuite',
        heap: '512m', directory: 'chat-regression', timeoutSeconds: 45,
        purpose: '验证聊天自动关界面、草稿交接与只提交一次'
    ],
    // 公共关页、延迟返料及所需菜单保留独立验证，避免其他游戏用例遮住角色任务的交接结论。
    guiRecoveryRegression: [
        entry: 'org.maiwithu.maicraft.client.actor.GuiRecoveryRegressionSuite',
        heap: '512m', directory: 'gui-recovery-regression', timeoutSeconds: 60,
        purpose: '验证角色任务自动关界面、返料等待与菜单交接'
    ],
    guiRegression: [
        entry: 'org.maiwithu.maicraft.client.actor.GuiRegressionSuite',
        heap: '512m', directory: 'gui-regression', timeoutSeconds: 45,
        purpose: '验证可见菜单、身体动作与任务收尾'
    ],
    // 合成材料匹配与逐格点击独立验证，其他任务模块失败时也能给出准确的合成回归结论。
    craftingRegression: [
        entry: 'org.maiwithu.maicraft.client.actor.CraftingRegressionSuite',
        heap: '512m', directory: 'crafting-regression', timeoutSeconds: 60,
        purpose: '验证标签材料、原生摆料与准确批次产物'
    ],
    // 拾取及死亡现场收场独立验证，归属推断不再决定角色能否尝试原生收取。
    pickupRegression: [
        entry: 'org.maiwithu.maicraft.client.actor.PickupRegressionSuite',
        heap: '512m', directory: 'pickup-regression', timeoutSeconds: 45,
        purpose: '验证不限归属的拾取、混堆记账与真实入包回执'
    ],
    knowledgeRegression: [
        entry: 'org.maiwithu.maicraft.mcp.KnowledgeRegressionSuite',
        heap: '512m', directory: 'knowledge-regression', timeoutSeconds: 45,
        purpose: '验证知识资源、教程提取与只读请求'
    ],
    attentionRegression: [
        entry: 'org.maiwithu.maicraft.mcp.AttentionRegressionSuite',
        heap: '512m', directory: 'attention-regression', timeoutSeconds: 45,
        purpose: '验证任务事件、状态查询与等待'
    ],
    combatRegression: [
        entry: 'org.maiwithu.maicraft.client.actor.CombatThreatsTest',
        heap: '512m', directory: 'combat-regression', timeoutSeconds: 45,
        purpose: '验证受伤证据与自动自卫'
    ],
    // R21 距离循环使用独立入口，单独核对格心站位与真实玩家攻击距离的边界。
    combatStanceReplayRegression: [
        entry: 'org.maiwithu.maicraft.client.actor.CombatStanceReplayTest',
        heap: '512m', directory: 'combat-stance-replay-regression', timeoutSeconds: 45,
        purpose: '回放近战站位与原生出刀边界'
    ],
    optionalServerRegression: [
        entry: 'org.maiwithu.maicraft.intent.OptionalServerRegressionSuite',
        heap: '768m', directory: 'optional-server-regression', timeoutSeconds: 90,
        purpose: '验证可选服务端协商、资源与生产证据'
    ],
    portalRegression: [
        entry: 'org.maiwithu.maicraft.core.task.dimension.PortalRegressionSuite',
        heap: '512m', directory: 'portal-regression', timeoutSeconds: 45,
        purpose: '验证传送门准备、权限与原生激活'
    ],
    semanticBlockSearchRegression: [
        entry: 'org.maiwithu.maicraft.intent.SemanticBlockSearchTest',
        heap: '512m', directory: 'semantic-block-search-regression', timeoutSeconds: 45,
        purpose: '验证已加载方块发现的证据、缺席语义与坐标不外泄'
    ],
    // 配方补料回放使用独立入口，核对替代原料回退与已观察效果后的承诺边界。
    recipeFrontierFallbackRegression: [
        entry: 'org.maiwithu.maicraft.core.task.acquire.RecipeFrontierFallbackTest',
        heap: '512m', directory: 'recipe-frontier-fallback-regression', timeoutSeconds: 60,
        purpose: '回放配方前沿替代材料失败与承诺边界'
    ],
    stonecuttingProcessRegression: [
        entry: 'org.maiwithu.maicraft.core.task.stonecutter.StonecuttingProcessTest',
        heap: '512m', directory: 'stonecutting-process-regression', timeoutSeconds: 45,
        purpose: '验证石切机原生工序的参数校验、站点匹配与诚实失败路径'
    ],
    spiralWalkerRegression: [
        entry: 'org.maiwithu.maicraft.core.scan.SpiralWalkerTest',
        heap: '512m', directory: 'spiral-walker-regression', timeoutSeconds: 45,
        purpose: '验证螺旋步进的转向次序、边长增长与落点合成'
    ],
]

// 无论单独运行一组还是执行 check，都使用同一套游戏资源与测试源码。
regressionSuites.each { name, suite ->
    def regression = tasks.register(name, JavaExec) {
        group = 'verification'
        description = suite.purpose
        dependsOn tasks.named('testClasses')
        classpath = sourceSets.test.runtimeClasspath
        classpath(tasks.named('createMinecraftArtifacts').flatMap { it.resourcesArtifact })
        mainClass = suite.entry
        maxHeapSize = suite.heap
        if (suite.timeoutSeconds != null) timeout = Duration.ofSeconds(suite.timeoutSeconds)
        def directory = layout.buildDirectory.dir(suite.directory)
        workingDir directory.get().asFile
        doFirst { directory.get().asFile.mkdirs() }
    }
    tasks.named('check') { dependsOn regression }
}

// 提供实际安装的 AE2 包时，原生工序回归还会核对注入位置；其他回归组不依赖该可选路径。
tasks.named('nativeProcessRegression', JavaExec) {
    if (providers.gradleProperty('maicraftAe2Jar').isPresent()) {
        systemProperty 'maicraft.test.ae2Jar', providers.gradleProperty('maicraftAe2Jar').get()
    }
}
