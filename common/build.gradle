    // 连锁采矿独立检查原生预览、范围与真实产物，避免借施工清障回归掩盖采集链路缺口。
    ultimineMiningRegression: [
        entry: 'org.maiwithu.maicraft.core.task.mine.UltimineMiningRegressionSuite',
        heap: '512m', directory: 'ultimine-mining-regression', timeoutSeconds: 90,
