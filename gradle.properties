# 用于资源模板的新增字段，需要加入 buildSrc/src/main/groovy/multiloader-common.gradle 的 expandProps。

# Project
# 项目版本、发布坐标与 Java 版本；资源占位符的实际展开表在 buildSrc 的 multiloader-common.gradle。
version=0.1.0
group=org.maiwithu.maicraft
java_version=21

# Common
# 游戏版本、Mod 展示信息以及声明兼容的游戏范围。
minecraft_version=1.21.1
mod_name=MaiCraft
mod_author=MaiWithU
mod_id=maicraft
license=GPL-3.0-only
credits=
description=First-person Minecraft agent runtime with an embedded MCP interface.
minecraft_version_range=[1.21.1, 1.21.2)
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
# 公共源码编译使用的 Minecraft 处理产物；Parchment 额外提供参数名等映射信息。
neo_form_version=1.21.1-20240808.144430
# The version of ParchmentMC that is used, see https://parchmentmc.org/docs/getting-started#choose-a-version for new versions
parchment_minecraft=1.21
parchment_version=2024.11.10

# Fabric
# Fabric 编译依赖版本与要求的最低加载器版本。
fabric_version=0.116.7+1.21.1
fabric_loader_version=0.18.1

# NeoForge
# NeoForge 编译版本与 FML 加载器范围，两者不是同一个版本号。
neoforge_version=21.1.233
neoforge_loader_version_range=[4,)

# Gradle
# 构建 JVM 的堆内存上限；daemon=false 不保留普通后台守护进程，必要时仍可启动一次性构建进程。
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
