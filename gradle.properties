# 新增给资源文件用的字段时，要同时加入 buildSrc/src/main/groovy/multiloader-common.gradle 的 expandProps。

# 项目
# v1 从 1.0.0 起步，与 v0 的 0.1.x 区分；合入 main 后由 CI 递增补丁号。
version=1.0.0
group=org.maiwithu.maicraft
java_version=21

# 公共模块
# 游戏版本、Mod 展示信息以及声明兼容的游戏范围；与 v0 实际在用的版本保持一致，开发客户端与实测实例可以共用。
minecraft_version=1.21.1
mod_name=MaiCraft
mod_author=MaiWithU
mod_id=maicraft
license=GPL-3.0-only
credits=
description=First-person Minecraft companion runtime with an embedded MCP interface.
minecraft_version_range=[1.21.1, 1.21.2)
## 公共模块编译用的 Minecraft 处理产物；版本列表见 https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.21.1-20240808.144430
# ParchmentMC 提供参数名等映射信息；版本列表见 https://parchmentmc.org/docs/getting-started#choose-a-version
parchment_minecraft=1.21
parchment_version=2024.11.10

# Fabric 模块
fabric_version=0.116.7+1.21.1
fabric_loader_version=0.18.1

# NeoForge 模块
# NeoForge 编译版本与 FML 加载器范围，两者不是同一个版本号。
neoforge_version=21.1.233
neoforge_loader_version_range=[4,)

# 存储
# 任务进度随 Mod 内置 SQLite 驱动，玩家无需单独安装数据库服务。
sqlite_jdbc_version=3.53.4.0

# 测试
# 公共模块的单元测试与架构护栏；只在测试类路径上，不进发布包。
junit_version=5.11.4
archunit_version=1.3.0

# Gradle 构建
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
